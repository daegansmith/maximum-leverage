<title>From Jimmy | Daegan Smith</title>
<style>
  :root { --bg:#FFFFFF; --ink:#111111; --soft:#555555; --rule:#DDDDDD; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --ink:#EDEBE5; --soft:#B4B2A9; --rule:#343330; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 Tahoma, Geneva, Verdana, sans-serif; }
  main { max-width:660px; margin:0 auto; padding:44px 16px 80px; }
  a { color:var(--ink); }
  .crumb { font-size:15px; margin:0 0 26px; } .crumb a { text-decoration:none; border-bottom:2px solid var(--ink); }
  .kicker { font-size:12px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; color:var(--soft); margin:0 0 8px; }
  h1 { font-size:38px; font-weight:900; line-height:1.15; margin:0 0 14px; }
  h2 { font-size:24px; line-height:1.25; margin:40px 0 14px; padding-top:26px; border-top:1px solid var(--rule); }
  p { margin:0 0 16px; } .soft { color:var(--soft); font-size:16px; }
  .cards { display:grid; gap:10px; margin:0 0 8px; }
  .card { display:grid; gap:3px; padding:14px 16px; border:2px solid var(--ink); color:var(--ink); text-decoration:none; }
  .card:hover { background:var(--ink); color:var(--bg); } .card:hover .cd, .card:hover .cw { color:var(--bg); }
  .ct { font-size:18px; font-weight:bold; line-height:1.3; }
  .cd { font-size:15px; line-height:1.5; color:var(--soft); }
  .cw { font-size:12px; letter-spacing:.5px; text-transform:uppercase; color:var(--soft); }
  ul.mail { list-style:none; padding:0; margin:0; }
  ul.mail li { padding:12px 0; border-bottom:1px solid var(--rule); font-size:16px; }
  ul.mail .d { display:inline-block; min-width:54px; font-weight:bold; }
  ul.mail .att { display:block; color:var(--soft); font-size:14px; margin-top:2px; }
  ul.plain { padding-left:20px; font-size:16px; } ul.plain li { margin-bottom:6px; }
  #gate { max-width:320px; margin:18vh auto 0; text-align:center; }
  #gate input { width:100%; padding:12px 14px; font:18px ui-monospace, Menlo, monospace; letter-spacing:.3em; text-align:center; border:2px solid var(--ink); background:var(--bg); color:var(--ink); }
  #gate button { margin-top:10px; width:100%; padding:11px; font:bold 14px Tahoma, sans-serif; letter-spacing:.12em; text-transform:uppercase; background:var(--ink); color:var(--bg); border:0; cursor:pointer; }
  #err { color:#b3261e; font-size:14px; min-height:20px; margin-top:10px; }
  #app { display:none; }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
function render(html) {
  const app = document.getElementById("app"); app.innerHTML = html;
  app.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  document.getElementById("gate").style.display = "none"; app.style.display = "block";
}
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault(); const err = document.getElementById("err"); err.textContent = "";
  try { const pw = document.getElementById("pw").value; render(await unlock(pw)); try { sessionStorage.setItem("jimmy-pw", pw); } catch(e){} }
  catch(x) { err.textContent = "Not that one."; }
});
(async () => { try { const pw = sessionStorage.getItem("jimmy-pw"); if (pw) render(await unlock(pw)); } catch(e){} })();
