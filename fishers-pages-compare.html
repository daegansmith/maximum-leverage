<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishers Pages, Live And Revised</title>
<style>
:root{--bg:#FFFFFF;--ink:#111111;--soft:#555555}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--ink:#EDEBE5;--soft:#B4B2A9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--ink:#EDEBE5;--soft:#B4B2A9;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Geneva,Verdana,sans-serif;display:flex;flex-direction:column}
.bar{border-bottom:2px solid var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
.in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.top a{color:var(--ink);font-weight:bold}
.top span{color:var(--soft)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));border:2px solid var(--ink)}
.row button{font:inherit;font-size:15px;font-weight:bold;padding:10px 6px;background:var(--bg);color:var(--ink);border:0;cursor:pointer}
.row button+button{border-left:2px solid var(--ink)}
.row button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row button:focus-visible{outline:3px solid var(--soft);outline-offset:-5px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style></head><body>
<div class="bar"><div class="in">
<div class="top"><a href="./#fishers">&larr; Fishers Funnel</a><span id="note"></span></div>
<div class="row" role="group" aria-label="Which page">
<button type="button" data-page="registration" aria-pressed="true">Registration</button>
<button type="button" data-page="registration-short" aria-pressed="false">Registration, Short</button>
<button type="button" data-page="thankyou" aria-pressed="false">Thank-You</button>
</div>
<div class="row" id="vers" role="group" aria-label="Which version">
<button type="button" data-ver="live" aria-pressed="false">Original (Oct 15)</button>
<button type="button" data-ver="oct19" aria-pressed="true">Original + Skills (Oct 19)</button>
<button type="button" data-ver="oct20" aria-pressed="false">With Jimmy And Paul (Oct 20)</button>
</div>
</div></div>
<iframe id="view" title="Page preview" src="fishers-registration-oct19.html"></iframe>
<script>
(function(){
  var page='registration',ver='oct19',f=document.getElementById('view'),vers=document.getElementById('vers'),note=document.getElementById('note');
  function go(){
    var short=page==='registration-short';
    vers.hidden=short;
    var suf=short?'':(ver==='live'?'':(ver==='oct20'?'-oct20':'-oct19'));
    f.src='fishers-'+page+suf+'.html';
    note.textContent=short?'The short version (original only)':(ver==='oct20'?'With Jimmy and Paul, Oct 20, with the live GoHighLevel form':(ver==='oct19'?'Original + Skills, Oct 19':'Original, Oct 15'));
    document.querySelectorAll('[data-page]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-page')===page)});
    document.querySelectorAll('[data-ver]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-ver')===ver)});
  }
  document.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){page=b.getAttribute('data-page');go()})});
  document.querySelectorAll('[data-ver]').forEach(function(b){b.addEventListener('click',function(){ver=b.getAttribute('data-ver');go()})});
  go();
})();
</script>
</body></html>
